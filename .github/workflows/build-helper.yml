name: Build AASHIS BOT Helper

on:
  workflow_dispatch:
  push:
    paths:
      - 'android_helper/**'
      - '.github/workflows/build-helper.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build helper APK
        run: gradle -p android_helper :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: AASHIS-BOT-Helper
          path: android_helper/app/build/outputs/apk/debug/*.apk
